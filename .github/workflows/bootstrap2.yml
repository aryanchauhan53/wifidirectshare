name: Bootstrap v2 — Symmetric Wi-Fi Direct Transfer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write app Gradle
        run: |
          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.wifidirectshare'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.wifidirectshare'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.activity:activity-ktx:1.9.3'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
          }
          EOF

      - name: Write manifest
        run: |
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission
                  android:name="android.permission.NEARBY_WIFI_DEVICES"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <uses-feature android:name="android.hardware.wifi.direct" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.WifiDirectShare">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FileTransferService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

      - name: Write resources
        run: |
          cat <<'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">WiFi Direct Share</string>
              <string name="btn_discover">Discover</string>
              <string name="btn_stop">Stop</string>
              <string name="btn_pick_files">Send Files</string>
              <string name="status_idle">Not connected</string>
              <string name="label_peers">Nearby peers</string>
              <string name="label_transfers">Transfers</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/status_idle"
                  android:textSize="14sp"
                  android:textStyle="bold"
                  android:paddingBottom="8dp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/discoverButton"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/btn_discover" />

                  <Button
                      android:id="@+id/stopButton"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/btn_stop" />
              </LinearLayout>

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:paddingTop="12dp"
                  android:text="@string/label_peers"
                  android:textStyle="bold" />

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/peersList"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <Button
                  android:id="@+id/sendButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/btn_pick_files" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:paddingTop="12dp"
                  android:text="@string/label_transfers"
                  android:textStyle="bold" />

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/transfersList"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="2" />
          </LinearLayout>
          EOF

          cat <<'EOF' > app/src/main/res/layout/item_transfer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:paddingVertical="8dp"
              android:paddingHorizontal="4dp">

              <TextView
                  android:id="@+id/name"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:maxLines="1"
                  android:ellipsize="middle"
                  android:textStyle="bold" />

              <com.google.android.material.progressindicator.LinearProgressIndicator
                  android:id="@+id/progress"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:max="100" />

              <TextView
                  android:id="@+id/bytes"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textSize="11sp"
                  android:layout_marginTop="2dp" />

              <TextView
                  android:id="@+id/status"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textSize="11sp"
                  android:textColor="#666666" />
          </LinearLayout>
          EOF

      - name: Write Kotlin sources
        run: |
          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/MainActivity.kt
          package com.example.wifidirectshare

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.net.wifi.p2p.WifiP2pDevice
          import android.net.wifi.p2p.WifiP2pInfo
          import android.net.wifi.p2p.WifiP2pManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.View
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.example.wifidirectshare.databinding.ActivityMainBinding
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private lateinit var wifiDirect: WifiDirectManager
              private val peerAdapter = PeerAdapter(::onPeerClicked)
              private val transferAdapter = TransferAdapter()

              private var connected = false
              private var isGroupOwner = false

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { r ->
                  if (!r.values.all { it }) Toast.makeText(this, "Permissions required", Toast.LENGTH_LONG).show()
              }

              private val filePicker = registerForActivityResult(
                  ActivityResultContracts.OpenMultipleDocuments()
              ) { uris ->
                  if (uris.isNullOrEmpty()) return@registerForActivityResult
                  val mgr = FileTransferService.instance?.transferManager
                  if (mgr == null) { setStatus("Service not running"); return@registerForActivityResult }
                  uris.forEach { uri ->
                      val name = queryDisplayName(uri) ?: "file"
                      val size = contentResolver.openFileDescriptor(uri, "r")?.use { it.statSize } ?: 0L
                      mgr.enqueueOutgoing(uri, name, size)
                  }
                  setStatus("Queued ${uris.size} file(s)")
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      when (intent.action) {
                          WifiP2pManager.WIFI_P2P_STATE_CHANGED_ACTION -> {
                              val on = intent.getIntExtra(WifiP2pManager.EXTRA_WIFI_STATE, -1) ==
                                  WifiP2pManager.WIFI_P2P_STATE_ENABLED
                              setStatus(if (on) "Wi-Fi Direct: on" else "Wi-Fi Direct: off")
                          }
                          WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION -> {
                              if (connected) return
                              wifiDirect.requestPeers { peers ->
                                  runOnUiThread {
                                      peerAdapter.submit(peers)
                                      setStatus("Peers: ${peers.size}")
                                  }
                              }
                          }
                          WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION -> {
                              wifiDirect.requestConnectionInfo { info ->
                                  if (info != null && info.groupFormed) onConnected(info) else onDisconnected()
                              }
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  wifiDirect = WifiDirectManager(this)

                  binding.peersList.layoutManager = LinearLayoutManager(this)
                  binding.peersList.adapter = peerAdapter
                  binding.transfersList.layoutManager = LinearLayoutManager(this)
                  binding.transfersList.adapter = transferAdapter

                  binding.discoverButton.setOnClickListener {
                      binding.peersList.visibility = View.VISIBLE
                      wifiDirect.discoverPeers { ok -> setStatus(if (ok) "Discovering..." else "Discovery failed") }
                  }
                  binding.stopButton.setOnClickListener {
                      wifiDirect.stopDiscovery()
                      setStatus("Discovery stopped")
                  }
                  binding.sendButton.isEnabled = false
                  binding.sendButton.setOnClickListener { filePicker.launch(arrayOf("*/*")) }

                  requestPermissionsAndGo()
                  watchService()
              }

              override fun onResume() {
                  super.onResume()
                  val f = IntentFilter().apply {
                      addAction(WifiP2pManager.WIFI_P2P_STATE_CHANGED_ACTION)
                      addAction(WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION)
                      addAction(WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION)
                  }
                  registerReceiver(receiver, f)
              }

              override fun onPause() {
                  super.onPause()
                  unregisterReceiver(receiver)
              }

              private fun requestPermissionsAndGo() {
                  val perms = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms += Manifest.permission.NEARBY_WIFI_DEVICES
                      perms += Manifest.permission.POST_NOTIFICATIONS
                  } else {
                      perms += Manifest.permission.ACCESS_FINE_LOCATION
                  }
                  if (Build.VERSION.SDK_INT <= 28) perms += Manifest.permission.WRITE_EXTERNAL_STORAGE
                  val missing = perms.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) permissionLauncher.launch(missing.toTypedArray())
              }

              private fun onPeerClicked(device: WifiP2pDevice) {
                  setStatus("Connecting to ${device.deviceName}...")
                  wifiDirect.connect(device) { ok -> setStatus(if (ok) "Connect requested" else "Connect failed") }
              }

              private fun onConnected(info: WifiP2pInfo) {
                  if (connected) return
                  connected = true
                  isGroupOwner = info.isGroupOwner
                  val role = if (isGroupOwner) "Group Owner" else "Client"
                  setStatus("Connected as $role")
                  binding.peersList.visibility = View.GONE
                  binding.discoverButton.isEnabled = false
                  binding.sendButton.isEnabled = true
                  FileTransferService.start(this, isGroupOwner, info.groupOwnerAddress.hostAddress)
              }

              private fun onDisconnected() {
                  if (!connected) return
                  connected = false
                  isGroupOwner = false
                  setStatus("Disconnected")
                  binding.peersList.visibility = View.VISIBLE
                  binding.discoverButton.isEnabled = true
                  binding.sendButton.isEnabled = false
                  stopService(Intent(this, FileTransferService::class.java))
              }

              private fun watchService() {
                  lifecycleScope.launch {
                      var current: StateFlow<List<TransferView>>? = null
                      var job: Job? = null
                      while (isActive) {
                          val mgr = FileTransferService.instance?.transferManager
                          if (mgr != null && current !== mgr.transfers) {
                              job?.cancel()
                              current = mgr.transfers
                              job = launch {
                                  mgr.transfers.collect { list ->
                                      runOnUiThread { transferAdapter.submit(list) }
                                  }
                              }
                          }
                          delay(300)
                      }
                  }
              }

              private fun queryDisplayName(uri: android.net.Uri): String? {
                  var n: String? = null
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (i >= 0 && c.moveToFirst()) n = c.getString(i)
                  }
                  return n
              }

              private fun setStatus(text: String) {
                  runOnUiThread { binding.statusText.text = text }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/TransferManager.kt
          package com.example.wifidirectshare

          import android.content.Context
          import android.net.Uri
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.channels.Channel
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import java.io.BufferedOutputStream
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.UUID
          import java.util.concurrent.atomic.AtomicLong

          enum class TransferDirection { INCOMING, OUTGOING }
          enum class TransferStatus { QUEUED, RUNNING, DONE, FAILED }

          data class TransferView(
              val id: String,
              val name: String,
              val direction: TransferDirection,
              val status: TransferStatus,
              val bytesDone: Long,
              val bytesTotal: Long,
              val error: String?
          ) {
              val progress: Int
                  get() = if (bytesTotal <= 0) 0 else ((bytesDone * 100) / bytesTotal).toInt().coerceIn(0, 100)
          }

          class TransferManager(private val context: Context) {

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val queue = Channel<OutgoingJob>(Channel.UNLIMITED)
              private val jobs = mutableMapOf<String, LiveJob>()

              private val _transfers = MutableStateFlow<List<TransferView>>(emptyList())
              val transfers: StateFlow<List<TransferView>> = _transfers.asStateFlow()

              @Volatile var remoteIp: String? = null

              private class LiveJob(
                  val id: String,
                  val name: String,
                  val direction: TransferDirection,
                  val total: Long
              ) {
                  val bytesDone = AtomicLong(0)
                  @Volatile var status: TransferStatus = TransferStatus.QUEUED
                  @Volatile var error: String? = null
              }

              private class OutgoingJob(val id: String, val name: String, val uri: Uri, val total: Long)

              init {
                  repeat(WORKERS) {
                      scope.launch {
                          for (job in queue) runOutgoing(job)
                      }
                  }
                  scope.launch {
                      while (isActive) {
                          delay(150)
                          publish()
                      }
                  }
              }

              fun enqueueOutgoing(uri: Uri, name: String, size: Long) {
                  val id = UUID.randomUUID().toString()
                  synchronized(jobs) { jobs[id] = LiveJob(id, name, TransferDirection.OUTGOING, size) }
                  queue.trySend(OutgoingJob(id, name, uri, size))
                  publish()
              }

              fun startIncoming(name: String, total: Long): String {
                  val id = UUID.randomUUID().toString()
                  synchronized(jobs) { jobs[id] = LiveJob(id, name, TransferDirection.INCOMING, total) }
                  publish()
                  return id
              }

              fun updateIncomingProgress(id: String, bytes: Long) {
                  synchronized(jobs) { jobs[id]?.bytesDone?.set(bytes) }
              }

              fun finishIncoming(id: String, error: String?) {
                  synchronized(jobs) { jobs[id] }?.let {
                      it.status = if (error == null) TransferStatus.DONE else TransferStatus.FAILED
                      it.error = error
                  }
                  publish()
              }

              private suspend fun runOutgoing(job: OutgoingJob) {
                  val live = synchronized(jobs) { jobs[job.id] } ?: return
                  live.status = TransferStatus.RUNNING
                  publish()
                  val peer = awaitPeer()
                  if (peer == null) {
                      live.status = TransferStatus.FAILED
                      live.error = "No peer connected"
                      publish()
                      return
                  }
                  try {
                      val socket = Socket().apply {
                          connect(InetSocketAddress(peer, ReceiverServer.PORT), 5000)
                          soTimeout = 15000
                      }
                      socket.use { s ->
                          val out = BufferedOutputStream(s.getOutputStream())
                          val nameBytes = job.name.toByteArray(Charsets.UTF_8)
                          writeLong(out, nameBytes.size.toLong())
                          out.write(nameBytes)
                          writeLong(out, job.total)
                          context.contentResolver.openInputStream(job.uri)?.use { input ->
                              val buf = ByteArray(8192)
                              var total = 0L
                              while (true) {
                                  val r = input.read(buf)
                                  if (r < 0) break
                                  out.write(buf, 0, r)
                                  total += r
                                  live.bytesDone.set(total)
                              }
                          }
                          out.flush()
                      }
                      live.status = TransferStatus.DONE
                      live.bytesDone.set(job.total)
                  } catch (e: Exception) {
                      live.status = TransferStatus.FAILED
                      live.error = e.message
                  }
                  publish()
              }

              private suspend fun awaitPeer(): String? {
                  repeat(50) {
                      remoteIp?.let { return it }
                      delay(100)
                  }
                  return null
              }

              private fun publish() {
                  val snap = synchronized(jobs) {
                      jobs.values.map { live ->
                          TransferView(live.id, live.name, live.direction, live.status,
                              live.bytesDone.get(), live.total, live.error)
                      }
                  }
                  _transfers.value = snap
              }

              private fun writeLong(out: OutputStream, v: Long) {
                  for (i in 7 downTo 0) out.write(((v shr (i * 8)) and 0xFF).toInt())
              }

              companion object { const val WORKERS = 3 }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/ReceiverServer.kt
          package com.example.wifidirectshare

          import android.content.Context
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.BufferedInputStream
          import java.io.InputStream
          import java.net.ServerSocket
          import java.net.Socket

          class ReceiverServer(
              private val context: Context,
              private val manager: TransferManager,
              private val onPeerRegistered: (String) -> Unit
          ) {
              private val scope = CoroutineScope(Dispatchers.IO + Job())
              @Volatile private var server: ServerSocket? = null

              fun start() {
                  if (server != null) return
                  scope.launch {
                      try {
                          val s = ServerSocket(PORT)
                          server = s
                          while (isActive && !s.isClosed) {
                              val client = try { s.accept() } catch (e: Exception) { break }
                              launch { handle(client) }
                          }
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }

              fun stop() {
                  try { server?.close() } catch (_: Exception) {}
                  server = null
              }

              private suspend fun handle(socket: Socket) = withContext(Dispatchers.IO) {
                  socket.use { s ->
                      val input = BufferedInputStream(s.getInputStream())
                      when (input.read()) {
                          MSG_REGISTER -> {
                              s.inetAddress.hostAddress?.let { onPeerRegistered(it) }
                          }
                          MSG_FILE -> {
                              val nameLen = readLong(input)
                              if (nameLen <= 0 || nameLen > 4096) return@use
                              val nameBytes = ByteArray(nameLen.toInt())
                              readFully(input, nameBytes)
                              val name = String(nameBytes, Charsets.UTF_8)
                              val size = readLong(input)
                              val id = manager.startIncoming(name, size)
                              try {
                                  DownloadSaver.save(context, name, input, size) { done ->
                                      manager.updateIncomingProgress(id, done)
                                  }
                                  manager.finishIncoming(id, null)
                              } catch (e: Exception) {
                                  manager.finishIncoming(id, e.message ?: "failed")
                              }
                          }
                      }
                  }
              }

              private fun readLong(input: InputStream): Long {
                  var r = 0L
                  for (i in 0 until 8) r = (r shl 8) or (input.read().toLong() and 0xFF)
                  return r
              }

              private fun readFully(input: InputStream, buf: ByteArray) {
                  var off = 0
                  while (off < buf.size) {
                      val n = input.read(buf, off, buf.size - off)
                      if (n < 0) break
                      off += n
                  }
              }

              companion object {
                  const val PORT = 8988
                  const val MSG_REGISTER = 0x02
                  const val MSG_FILE = 0x01
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/FileTransferService.kt
          package com.example.wifidirectshare

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import java.net.InetSocketAddress
          import java.net.Socket

          class FileTransferService : Service() {

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              lateinit var transferManager: TransferManager
                  private set
              private var receiverServer: ReceiverServer? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  transferManager = TransferManager(this)
                  receiverServer = ReceiverServer(this, transferManager) { ip ->
                      if (!transferManager.isGroupOwner) transferManager.remoteIp = ip
                  }.also { it.start() }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startInForeground()
                  val isGo = intent?.getBooleanExtra(EXTRA_IS_GROUP_OWNER, false) ?: false
                  val goAddr = intent?.getStringExtra(EXTRA_GO_ADDRESS)
                  transferManager.isGroupOwner = isGo
                  if (!isGo && goAddr != null) {
                      transferManager.remoteIp = goAddr
                      registerWithGroupOwner(goAddr)
                  }
                  return START_NOT_STICKY
              }

              private fun startInForeground() {
                  val channelId = "wifidirect_transfer"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(NotificationManager::class.java)
                      if (nm.getNotificationChannel(channelId) == null) {
                          nm.createNotificationChannel(
                              NotificationChannel(channelId, "Wi-Fi Direct Transfer", NotificationManager.IMPORTANCE_LOW)
                          )
                      }
                  }
                  val notif = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Wi-Fi Direct Share")
                      .setContentText("Session active")
                      .setSmallIcon(android.R.drawable.stat_sys_upload)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(1, notif)
                  }
              }

              private fun registerWithGroupOwner(goAddr: String) {
                  scope.launch {
                      var attempts = 0
                      while (attempts < 5) {
                          try {
                              Socket().use { s ->
                                  s.connect(InetSocketAddress(goAddr, ReceiverServer.PORT), 3000)
                                  s.getOutputStream().write(ReceiverServer.MSG_REGISTER)
                                  s.getOutputStream().flush()
                              }
                              return@launch
                          } catch (_: Exception) {
                              attempts++
                              Thread.sleep(1000)
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  receiverServer?.stop()
                  scope.cancel()
                  instance = null
                  super.onDestroy()
              }

              companion object {
                  const val EXTRA_IS_GROUP_OWNER = "is_group_owner"
                  const val EXTRA_GO_ADDRESS = "go_address"

                  @Volatile var instance: FileTransferService? = null
                      private set

                  fun start(context: Context, isGroupOwner: Boolean, goAddress: String?) {
                      val i = Intent(context, FileTransferService::class.java).apply {
                          putExtra(EXTRA_IS_GROUP_OWNER, isGroupOwner)
                          putExtra(EXTRA_GO_ADDRESS, goAddress)
                      }
                      if (Build.VERSION.SDK_INT >= 26) context.startForegroundService(i)
                      else context.startService(i)
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/TransferAdapter.kt
          package com.example.wifidirectshare

          import android.view.LayoutInflater
          import android.view.ViewGroup
          import androidx.recyclerview.widget.DiffUtil
          import androidx.recyclerview.widget.RecyclerView
          import com.example.wifidirectshare.databinding.ItemTransferBinding

          class TransferAdapter : RecyclerView.Adapter<TransferAdapter.VH>() {

              private val items = mutableListOf<TransferView>()

              fun submit(list: List<TransferView>) {
                  val old = items.toList()
                  items.clear()
                  items.addAll(list)
                  DiffUtil.calculateDiff(object : DiffUtil.Callback() {
                      override fun getOldListSize() = old.size
                      override fun getNewListSize() = items.size
                      override fun areItemsTheSame(a: Int, b: Int) = old[a].id == items[b].id
                      override fun areContentsTheSame(a: Int, b: Int) = old[a] == items[b]
                  }).dispatchUpdatesTo(this)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH =
                  VH(ItemTransferBinding.inflate(LayoutInflater.from(parent.context), parent, false))

              override fun onBindViewHolder(holder: VH, position: Int) = holder.bind(items[position])

              override fun getItemCount() = items.size

              class VH(val binding: ItemTransferBinding) : RecyclerView.ViewHolder(binding.root) {
                  fun bind(t: TransferView) {
                      val arrow = if (t.direction == TransferDirection.INCOMING) "\u2193" else "\u2191"
                      binding.name.text = "$arrow ${t.name}"
                      binding.progress.setProgressCompat(t.progress, true)
                      val done = t.bytesDone / (1024.0 * 1024.0)
                      val total = t.bytesTotal / (1024.0 * 1024.0)
                      binding.bytes.text = String.format("%.2f MB / %.2f MB", done, total)
                      binding.status.text = when (t.status) {
                          TransferStatus.QUEUED -> "Queued"
                          TransferStatus.RUNNING -> "${t.progress}%"
                          TransferStatus.DONE -> "Done"
                          TransferStatus.FAILED -> "Failed: ${t.error ?: ""}"
                      }
                  }
              }
          }
