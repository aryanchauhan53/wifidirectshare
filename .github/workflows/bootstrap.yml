name: Bootstrap Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard against accidental re-run
        run: |
          if [ -f "settings.gradle" ] || [ -f "app/build.gradle" ]; then
            echo "::error::Project files already exist. This bootstrap workflow is one-shot. Aborting."
            exit 1
          fi

      - name: Create directory tree
        run: |
          mkdir -p app/src/main/java/com/example/wifidirectshare
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper
          mkdir -p .github/workflows

      - name: Write root Gradle files
        run: |
          cat <<'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WifiDirectShare"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat <<'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Write app Gradle config
        run: |
          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.wifidirectshare'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.wifidirectshare'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
          }
          EOF

          cat <<'EOF' > app/proguard-rules.pro
          # Default project proguard rules. No custom rules needed.
          EOF

      - name: Write manifest and resources
        run: |
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission
                  android:name="android.permission.NEARBY_WIFI_DEVICES"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <uses-feature android:name="android.hardware.wifi.direct" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.WifiDirectShare">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">WiFi Direct Share</string>
              <string name="btn_discover">Discover Peers</string>
              <string name="btn_stop">Stop</string>
              <string name="btn_pick_file">Pick File to Send</string>
              <string name="btn_start_server">Start Receive Server</string>
              <string name="status_idle">Idle</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.WifiDirectShare" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">#3F51B5</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/status_idle"
                  android:textSize="16sp"
                  android:paddingBottom="12dp" />

              <Button
                  android:id="@+id/discoverButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/btn_discover" />

              <Button
                  android:id="@+id/stopButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/btn_stop" />

              <Button
                  android:id="@+id/startServerButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/btn_start_server" />

              <Button
                  android:id="@+id/pickFileButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/btn_pick_file" />

              <Button
                  android:id="@+id/sendButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Send Picked File" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:paddingTop="16dp"
                  android:text="Nearby peers:"
                  android:textStyle="bold" />

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/peersList"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <TextView
                  android:id="@+id/logText"
                  android:layout_width="match_parent"
                  android:layout_height="120dp"
                  android:scrollbars="vertical"
                  android:background="#11000000"
                  android:padding="8dp"
                  android:textSize="11sp"
                  android:typeface="monospace" />
          </LinearLayout>
          EOF

      - name: Write Kotlin sources
        run: |
          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/MainActivity.kt
          package com.example.wifidirectshare

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.net.wifi.p2p.WifiP2pDevice
          import android.net.wifi.p2p.WifiP2pInfo
          import android.net.wifi.p2p.WifiP2pManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.example.wifidirectshare.databinding.ActivityMainBinding
          import java.io.OutputStream
          import java.net.InetAddress
          import java.net.Socket

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding
              private lateinit var wifiDirect: WifiDirectManager
              private val peerAdapter = PeerAdapter(::onPeerClicked)
              private var pickedFileUri: Uri? = null
              private var groupOwnerAddress: InetAddress? = null

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { results ->
                  if (results.values.all { it }) appendLog("Permissions granted")
                  else Toast.makeText(this, "Permissions required for Wi-Fi Direct", Toast.LENGTH_LONG).show()
              }

              private val filePicker = registerForActivityResult(
                  ActivityResultContracts.GetContent()
              ) { uri ->
                  if (uri != null) {
                      pickedFileUri = uri
                      appendLog("Selected: ${queryDisplayName(uri) ?: "file"}")
                  }
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      when (intent.action) {
                          WifiP2pManager.WIFI_P2P_STATE_CHANGED_ACTION -> {
                              val enabled = intent.getIntExtra(WifiP2pManager.EXTRA_WIFI_STATE, -1) ==
                                  WifiP2pManager.WIFI_P2P_STATE_ENABLED
                              appendLog("Wi-Fi Direct enabled: $enabled")
                          }
                          WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION -> {
                              wifiDirect.requestPeers { peers ->
                                  runOnUiThread {
                                      peerAdapter.submit(peers)
                                      appendLog("Peers found: ${peers.size}")
                                  }
                              }
                          }
                          WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION -> {
                              wifiDirect.requestConnectionInfo { info: WifiP2pInfo? ->
                                  if (info != null && info.groupFormed) {
                                      groupOwnerAddress = info.groupOwnerAddress
                                      val role = if (info.isGroupOwner) "GROUP OWNER" else "CLIENT"
                                      runOnUiThread {
                                          appendLog("Connected as $role @ ${info.groupOwnerAddress.hostAddress}")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  wifiDirect = WifiDirectManager(this)

                  binding.peersList.layoutManager = LinearLayoutManager(this)
                  binding.peersList.adapter = peerAdapter

                  binding.discoverButton.setOnClickListener { startDiscovery() }
                  binding.stopButton.setOnClickListener {
                      wifiDirect.stopDiscovery()
                      appendLog("Discovery stopped")
                  }
                  binding.startServerButton.setOnClickListener { startReceiveServer() }
                  binding.pickFileButton.setOnClickListener { filePicker.launch("*/*") }
                  binding.sendButton.setOnClickListener {
                      val uri = pickedFileUri
                      if (uri == null) appendLog("Pick a file first") else sendFile(uri)
                  }

                  requestRuntimePermissions()
              }

              override fun onResume() {
                  super.onResume()
                  val filter = IntentFilter().apply {
                      addAction(WifiP2pManager.WIFI_P2P_STATE_CHANGED_ACTION)
                      addAction(WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION)
                      addAction(WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION)
                  }
                  registerReceiver(receiver, filter)
              }

              override fun onPause() {
                  super.onPause()
                  unregisterReceiver(receiver)
              }

              private fun requestRuntimePermissions() {
                  val perms = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms += Manifest.permission.NEARBY_WIFI_DEVICES
                      perms += Manifest.permission.POST_NOTIFICATIONS
                  } else {
                      perms += Manifest.permission.ACCESS_FINE_LOCATION
                  }
                  val missing = perms.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) permissionLauncher.launch(missing.toTypedArray())
              }

              private fun startDiscovery() {
                  wifiDirect.discoverPeers { ok ->
                      runOnUiThread { appendLog(if (ok) "Discovery started" else "Discovery failed") }
                  }
              }

              private fun onPeerClicked(device: WifiP2pDevice) {
                  appendLog("Connecting to ${device.deviceName}...")
                  wifiDirect.connect(device) { ok ->
                      runOnUiThread { appendLog(if (ok) "Connect request sent" else "Connect failed") }
                  }
              }

              private fun startReceiveServer() {
                  wifiDirect.requestConnectionInfo { info ->
                      if (info != null && info.groupFormed) {
                          groupOwnerAddress = info.groupOwnerAddress
                          FileTransferService.startReceiver(this)
                          appendLog("Receive server started on this device")
                      } else {
                          runOnUiThread { appendLog("Connect to a peer first") }
                      }
                  }
              }

              private fun sendFile(uri: Uri) {
                  val addr = groupOwnerAddress ?: run { appendLog("No connection"); return }
                  val name = queryDisplayName(uri) ?: "file"
                  Thread {
                      try {
                          Socket(addr, FileTransferService.PORT).use { s ->
                              val out = s.getOutputStream()
                              val nameBytes = name.toByteArray(Charsets.UTF_8)
                              writeLong(out, nameBytes.size.toLong())
                              out.write(nameBytes)
                              val size = contentResolver.openFileDescriptor(uri, "r")!!.statSize
                              writeLong(out, size)
                              contentResolver.openInputStream(uri)!!.use { it.copyTo(out, 8192) }
                              out.flush()
                              runOnUiThread { appendLog("Sent $name ($size bytes)") }
                          }
                      } catch (e: Exception) {
                          runOnUiThread { appendLog("Send failed: ${e.message}") }
                      }
                  }.start()
              }

              private fun writeLong(out: OutputStream, value: Long) {
                  for (i in 7 downTo 0) out.write(((value shr (i * 8)) and 0xFF).toInt())
              }

              private fun queryDisplayName(uri: Uri): String? {
                  var name: String? = null
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && c.moveToFirst()) name = c.getString(idx)
                  }
                  return name
              }

              private fun appendLog(line: String) {
                  runOnUiThread { binding.logText.append("\n$line") }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/WifiDirectManager.kt
          package com.example.wifidirectshare

          import android.annotation.SuppressLint
          import android.content.Context
          import android.net.wifi.p2p.WifiP2pConfig
          import android.net.wifi.p2p.WifiP2pDevice
          import android.net.wifi.p2p.WifiP2pInfo
          import android.net.wifi.p2p.WifiP2pManager
          import android.net.wifi.p2p.WifiP2pManager.Channel
          import android.os.Looper

          class WifiDirectManager(private val context: Context) {

              private val manager: WifiP2pManager? =
                  context.getSystemService(Context.WIFI_P2P_SERVICE) as? WifiP2pManager

              private var channel: Channel? = null

              init {
                  if (manager != null) {
                      channel = manager.initialize(context, Looper.getMainLooper(), null)
                  }
              }

              @SuppressLint("MissingPermission")
              fun discoverPeers(onResult: (Boolean) -> Unit) {
                  if (manager == null || channel == null) { onResult(false); return }
                  manager.discoverPeers(channel, object : WifiP2pManager.ActionListener {
                      override fun onSuccess() = onResult(true)
                      override fun onFailure(reason: Int) = onResult(false)
                  })
              }

              @SuppressLint("MissingPermission")
              fun stopDiscovery() {
                  if (manager == null || channel == null) return
                  manager.stopPeerDiscovery(channel, null)
              }

              @SuppressLint("MissingPermission")
              fun requestPeers(onPeers: (List<WifiP2pDevice>) -> Unit) {
                  if (manager == null || channel == null) { onPeers(emptyList()); return }
                  manager.requestPeers(channel) { list -> onPeers(list.deviceList.toList()) }
              }

              @SuppressLint("MissingPermission")
              fun connect(device: WifiP2pDevice, onResult: (Boolean) -> Unit) {
                  if (manager == null || channel == null) { onResult(false); return }
                  val config = WifiP2pConfig().apply {
                      deviceAddress = device.deviceAddress
                      groupOwnerIntent = 0
                  }
                  manager.connect(channel, config, object : WifiP2pManager.ActionListener {
                      override fun onSuccess() = onResult(true)
                      override fun onFailure(reason: Int) = onResult(false)
                  })
              }

              @SuppressLint("MissingPermission")
              fun requestConnectionInfo(onInfo: (WifiP2pInfo?) -> Unit) {
                  if (manager == null || channel == null) { onInfo(null); return }
                  manager.requestConnectionInfo(channel) { info -> onInfo(info) }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/PeerAdapter.kt
          package com.example.wifidirectshare

          import android.net.wifi.p2p.WifiP2pDevice
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class PeerAdapter(
              private val onPick: (WifiP2pDevice) -> Unit
          ) : RecyclerView.Adapter<PeerAdapter.VH>() {

              private val items = mutableListOf<WifiP2pDevice>()

              fun submit(devices: List<WifiP2pDevice>) {
                  items.clear()
                  items.addAll(devices)
                  notifyDataSetChanged()
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val v = LayoutInflater.from(parent.context)
                      .inflate(android.R.layout.simple_list_item_2, parent, false)
                  return VH(v)
              }

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val d = items[position]
                  holder.title.text = d.deviceName
                  holder.subtitle.text = d.deviceAddress
                  holder.itemView.setOnClickListener { onPick(d) }
              }

              override fun getItemCount() = items.size

              class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val title: TextView = v.findViewById(android.R.id.text1)
                  val subtitle: TextView = v.findViewById(android.R.id.text2)
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/example/wifidirectshare/FileTransferService.kt
          package com.example.wifidirectshare

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Environment
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import java.io.File
          import java.io.FileOutputStream
          import java.io.InputStream
          import java.net.ServerSocket
          import java.util.concurrent.Executors

          class FileTransferService : Service() {

              private val executor = Executors.newSingleThreadExecutor()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground(1, buildNotification())
                  executor.execute {
                      try {
                          ServerSocket(PORT).use { server ->
                              val socket = server.accept()
                              socket.use { s ->
                                  val input = s.getInputStream()
                                  val nameLen = readLong(input)
                                  val nameBytes = ByteArray(nameLen.toInt())
                                  readFully(input, nameBytes)
                                  val name = String(nameBytes, Charsets.UTF_8)
                                  val size = readLong(input)

                                  val dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: filesDir
                                  if (!dir.exists()) dir.mkdirs()
                                  val out = File(dir, sanitize(name))
                                  FileOutputStream(out).use { fos ->
                                      val buf = ByteArray(8192)
                                      var remaining = size
                                      while (remaining > 0) {
                                          val r = input.read(buf, 0, minOf(buf.size.toLong(), remaining).toInt())
                                          if (r < 0) break
                                          fos.write(buf, 0, r)
                                          remaining -= r
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  executor.shutdownNow()
                  super.onDestroy()
              }

              private fun buildNotification(): android.app.Notification {
                  val channelId = "wifidirect_transfer"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(NotificationManager::class.java)
                      if (nm.getNotificationChannel(channelId) == null) {
                          nm.createNotificationChannel(
                              NotificationChannel(channelId, "Wi-Fi Direct Transfer", NotificationManager.IMPORTANCE_LOW)
                          )
                      }
                  }
                  return NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Wi-Fi Direct Share")
                      .setContentText("Waiting for incoming file...")
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .build()
              }

              private fun readLong(input: InputStream): Long {
                  var result = 0L
                  for (i in 0 until 8) result = (result shl 8) or (input.read().toLong() and 0xFF)
                  return result
              }

              private fun readFully(input: InputStream, buf: ByteArray) {
                  var off = 0
                  while (off < buf.size) {
                      val r = input.read(buf, off, buf.size - off)
                      if (r < 0) break
                      off += r
                  }
              }

              private fun sanitize(name: String): String =
                  name.replace(Regex("[^A-Za-z0-9._-]"), "_").ifBlank { "received_file" }

              companion object {
                  const val PORT = 8988
                  fun startReceiver(context: Context) {
                      val i = Intent(context, FileTransferService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) context.startForegroundService(i)
                      else context.startService(i)
                  }
              }
          }
          EOF

      - name: Write README, gitignore and build workflow
        run: |
          cat <<'EOF' > README.md
          # WiFi Direct Share

          Android-to-Android file sharing over Wi-Fi Direct (P2P), no router required.

          ## Build
          - Locally: `gradle assembleDebug`
          - CI: push to `main`; the build workflow uploads `app-debug.apk` as an artifact.

          ## Use
          1. Install on two devices.
          2. Tap **Discover Peers** on both.
          3. Tap a peer name to connect (one becomes group owner).
          4. On the **group owner**, tap **Start Receive Server**.
          5. On either device, tap **Pick File to Send**, then **Send Picked File**.
             Files are saved to `Android/data/com.example.wifidirectshare/files/Download/`.

          ## Permissions
          Location (pre-13) / Nearby Wi-Fi Devices + Notifications (13+). Required by Android for Wi-Fi Direct.

          ## Notes
          - Verified to compile via CI; runtime P2P behavior must be tested on two physical devices.
          - Transfer uses a plain TCP socket on port 8988 over the P2P interface.
          EOF

          cat <<'EOF' > .gitignore
          *.iml
          .gradle/
          /local.properties
          /.idea/
          .DS_Store
          /build
          /app/build
          /captures
          .externalNativeBuild
          .cxx
          local.properties
          EOF

          cat <<'EOF' > .github/workflows/build-apk.yml
          name: Build Android APK

          on:
            workflow_dispatch:
            push:
              branches: [ "main" ]

          jobs:
            build:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout source
                  uses: actions/checkout@v4

                - name: Set up Java
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"

                - name: Set up Gradle
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: "8.9"

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v4

                - name: Install Android SDK
                  run: |
                    sdkmanager "platforms;android-35" \
                               "build-tools;35.0.0"

                - name: Build debug APK
                  run: gradle --no-daemon assembleDebug

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: WifiDirectShare-debug-apk
                    path: app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
                    retention-days: 14
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (unexpected)."
            exit 1
          fi
          git commit -m "Bootstrap: generate Android Wi-Fi Direct project"
          git push

      - name: Summary
        run: |
          echo "### Bootstrap complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Project generated and pushed. You can now:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Delete this workflow file** (\`.github/workflows/bootstrap.yml\`) — it's one-shot and would fail on re-run." >> $GITHUB_STEP_SUMMARY
          echo "2. Go to **Actions → Build Android APK** to build and download the debug APK." >> $GITHUB_STEP_SUMMARY
